</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo } from "react";
        import { createRoot } from "react-dom/client";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Your web app's NEW Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBsHQRwfRC8WCbElnGQTxZB3jIvObwloaM",
            authDomain: "vehicle-r-35acc.firebaseapp.com",
            projectId: "vehicle-r-35acc",
            storageBucket: "vehicle-r-35acc.firebasestorage.app",
            messagingSenderId: "1004078230530",
            appId: "1:1004078230530:web:02fdb9dd274717ad6c8b1b"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- Icons (Inline SVG for reliability) ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                car: <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2m10-5h5m-6 0h.01M5 16a2 2 0 1 0 4 0a2 2 0 1 0-4 0m10 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0m-1-5H6l1.2-2.5A.6.6 0 0 1 7.8 8h8.3c.3 0 .5.1.7.3l1.2 2.7Z" />,
                wrench: <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.7-3.7a1 1 0 0 0 0-1.4l-1.6-1.6a1 1 0 0 0-1.4 0l-3.7 3.7Zm1.6 1.6c-3.9-3.9-10.9-2.3-13.8.6a1.1 1.1 0 0 0 0 1.5l8.1 8.1c.4.4 1 .4 1.5 0c2.9-2.9 4.5-9.9.6-13.8l3.6 3.6Z" />,
                plus: <path d="M5 12h14m-7-7v14" />,
                trash: <path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2m-6 5v6m4-6v6" />,
                pencil: <path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />,
                alert: <g><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></g>,
                chevronLeft: <path d="m15 18-6-6 6-6" />,
                search: <g><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></g>,
                activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2" />,
                fuel: <path d="M3 22v-8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8M15 14h.01M10 14h.01M15 10V6a4 4 0 0 0-8 0v4h8Z" />,
                save: <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2zM17 21v-8H7v8M7 3v5h8" />,
                x: <path d="M18 6 6 18M6 6l12 12" />,
                fileText: <g><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" /><polyline points="14 2 14 8 20 8" /><line x1="16" y1="13" x2="8" y2="13" /><line x1="16" y1="17" x2="8" y2="17" /><polyline points="10 9 9 9 8 9" /></g>,
                bell: <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />,
                card: <rect x="2" y="5" width="20" height="14" rx="2" ry="2" />,
                printer: <g><polyline points="6 9 6 2 18 2 18 9" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect x="6" y="14" width="12" height="8" /></g>,
                download: <g><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></g>,
                fileSpreadsheet: <g><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /><path d="M8 13h8" /><path d="M8 17h8" /><path d="M10 9h4" /></g>,
                filePdf: <g><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /><path d="M9 15v-4h2.5a1.5 1.5 0 0 1 0 3H9" /></g>,
                layers: <g><polygon points="12 2 2 7 12 12 22 7 12 2" /><polyline points="2 17 12 22 22 17" /><polyline points="2 12 12 17 22 12" /></g>,
                logout: <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4m7 14 5-5-5-5m5 5H9" />
            };

            return (
                <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    width={size} 
                    height={size} 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    strokeWidth="2" 
                    strokeLinecap="round" 
                    strokeLinejoin="round" 
                    className={className}
                >
                    {icons[name] || <circle cx="12" cy="12" r="10"/>}
                </svg>
            );
        };

        const getDaysUntil = (dateStr) => {
            if (!dateStr) return null;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const target = new Date(dateStr);
            target.setHours(0, 0, 0, 0);
            const diffTime = target - today;
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        };

        const Card = ({ children, className = '' }) => (
            <div className={`bg-white rounded-2xl shadow-soft border border-olive-100 overflow-hidden ${className}`}>
                {children}
            </div>
        );

        const Button = ({ children, onClick, variant = 'primary', className = '', icon, title, disabled = false, type = "button" }) => {
            const baseStyle = "inline-flex items-center justify-center px-5 py-2.5 rounded-xl font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-1 disabled:opacity-50 disabled:cursor-not-allowed transform active:scale-95";
            const variants = {
                primary: "bg-olive-600 text-white hover:bg-olive-700 shadow-lg shadow-olive-600/20 focus:ring-olive-500",
                secondary: "bg-cream-100 text-olive-800 border border-olive-200 hover:bg-olive-50 hover:border-olive-300 focus:ring-olive-400",
                danger: "bg-red-50 text-red-700 border border-red-100 hover:bg-red-100 focus:ring-red-500",
                ghost: "text-olive-600 hover:text-olive-800 hover:bg-olive-50",
            };
            return (
                <button type={type} onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant]} ${className}`} title={title}>
                    {icon && <span className="mr-2"><Icon name={icon} size={18} /></span>}
                    {children}
                </button>
            );
        };

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-olive-900/40 backdrop-blur-sm p-4 no-print">
                    <div className="bg-cream-100 rounded-3xl shadow-2xl w-full max-w-md overflow-hidden animate-[fadeIn_0.2s_ease-out]">
                        <div className="flex justify-between items-center p-5 border-b border-olive-100 bg-white">
                            <h3 className="font-bold text-xl text-olive-900">{title}</h3>
                            <button onClick={onClose} className="p-2 text-olive-400 hover:text-olive-700 hover:bg-olive-50 rounded-full transition-colors">
                                <Icon name="x" size={20} />
                            </button>
                        </div>
                        <div className="p-6 max-h-[80vh] overflow-y-auto">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        const ConfirmationModal = ({ isOpen, onClose, onConfirm, title, message, confirmText = "Confirm", variant = "danger" }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center bg-olive-900/60 backdrop-blur-sm p-4 no-print">
                    <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden animate-[fadeIn_0.2s_ease-out]">
                        <div className="p-6 text-center">
                            <div className="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4 text-red-600">
                                <Icon name="alert" size={32} />
                            </div>
                            <h3 className="font-bold text-xl text-earth-800 mb-2">{title}</h3>
                            <p className="text-earth-600 mb-6">{message}</p>
                            <div className="flex gap-3">
                                <Button onClick={onClose} variant="secondary" className="flex-1">Cancel</Button>
                                <Button onClick={onConfirm} variant={variant} className="flex-1">{confirmText}</Button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const InputGroup = ({ label, children, subtext }) => (
            <div className="space-y-1.5">
                <label className="block text-sm font-semibold text-olive-800">{label}</label>
                {children}
                {subtext && <p className="text-xs text-olive-500">{subtext}</p>}
            </div>
        );

        const NotificationBanner = ({ notifications }) => {
            if (!notifications || notifications.length === 0) return null;
            return (
                <div className="space-y-3 mb-8 no-print">
                    {notifications.map((note, index) => (
                        <div key={index} className={`flex items-start p-4 rounded-xl border ${note.type === 'expired' ? 'bg-red-50 border-red-100 text-red-800' : 'bg-yellow-50 border-yellow-100 text-yellow-800'}`}>
                            <div className={`p-2 rounded-full mr-3 ${note.type === 'expired' ? 'bg-red-100 text-red-600' : 'bg-yellow-100 text-yellow-600'}`}>
                                <Icon name="alert" size={18} />
                            </div>
                            <div>
                                <h4 className="font-bold text-sm">{note.title}</h4>
                                <p className="text-sm opacity-90">{note.msg}</p>
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        // --- Main App Component ---
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'vehicle-tracker';

        // Helper to get today's date + N days
        const getFutureDate = (days) => {
            const date = new Date();
            date.setDate(date.getDate() + days);
            return date.toISOString().split('T')[0];
        };

        const getPastDate = (days) => {
            const date = new Date();
            date.setDate(date.getDate() - days);
            return date.toISOString().split('T')[0];
        };

        // Fallback data when Firebase fails
        const FALLBACK_VEHICLES = [
            { 
                id: '1', 
                make: 'Toyota', 
                model: 'Camry', 
                year: 2019, 
                plate: 'ABC-1234', 
                color: 'Pearl White', 
                mileage: 45000, 
                type: 'sedan', 
                notes: 'Daily commuter (Local Mode)',
                trafficFileNo: 'DXB-102938',
                mulkiyaNo: '99887766',
                mulkiyaExpiry: getFutureDate(10), 
                insuranceProvider: 'Oman Insurance',
                insuranceExpiry: getFutureDate(40) 
            }
        ];

        function App() {
            // Setup & Connection States
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [authLoading, setAuthLoading] = useState(true);
            const [dbMode, setDbMode] = useState('cloud'); // 'cloud' or 'local'
            const [authError, setAuthError] = useState(null);

            // Auth Screen States
            const [isLoginMode, setIsLoginMode] = useState(true);
            const [authEmail, setAuthEmail] = useState('');
            const [authPassword, setAuthPassword] = useState('');
            const [authInProgress, setAuthInProgress] = useState(false);

            // Data States
            const [vehicles, setVehicles] = useState([]);
            const [logs, setLogs] = useState([]);
            
            // UI States
            const [activeTab, setActiveTab] = useState('garage');
            const [selectedVehicleId, setSelectedVehicleId] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [logSearchTerm, setLogSearchTerm] = useState('');
            const [isVehicleModalOpen, setIsVehicleModalOpen] = useState(false);
            const [editingVehicle, setEditingVehicle] = useState(null);
            const [isAddLogOpen, setIsAddLogOpen] = useState(false);
            const [editingLog, setEditingLog] = useState(null);
            const [deleteConfirmation, setDeleteConfirmation] = useState({ isOpen: false, type: null, id: null });
            const [isExportPlateModalOpen, setIsExportPlateModalOpen] = useState(false);
            const [selectedExportPlate, setSelectedExportPlate] = useState('ALL');

            // Handle Authentication & Fallback
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        }
                    } catch (error) {
                        if (error.code !== 'auth/custom-token-mismatch') {
                            console.error("Token Auth Error:", error);
                        }
                    }
                };
                initAuth();

                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    setAuthLoading(false);
                });
                return () => unsubscribe();
            }, []);

            // Local Storage Logic (Fallback)
            useEffect(() => {
                if (dbMode !== 'local') return;
                
                const localVehicles = localStorage.getItem('autolog_vehicles');
                const localLogs = localStorage.getItem('autolog_logs');
                
                if (localVehicles) {
                    setVehicles(JSON.parse(localVehicles));
                } else {
                    setVehicles(FALLBACK_VEHICLES);
                    localStorage.setItem('autolog_vehicles', JSON.stringify(FALLBACK_VEHICLES));
                }
                
                if (localLogs) setLogs(JSON.parse(localLogs));
                setLoading(false);
            }, [dbMode]);

            // Save to LocalStorage whenever data changes in local mode
            useEffect(() => {
                if (dbMode === 'local' && !loading) {
                    localStorage.setItem('autolog_vehicles', JSON.stringify(vehicles));
                }
            }, [vehicles, dbMode, loading]);

            useEffect(() => {
                if (dbMode === 'local' && !loading) {
                    localStorage.setItem('autolog_logs', JSON.stringify(logs));
                }
            }, [logs, dbMode, loading]);

            // Load Data from Firestore
            useEffect(() => {
                if (!user || dbMode === 'local') return;
                
                const vehiclesRef = collection(db, 'artifacts', APP_ID, 'users', user.uid, 'vehicles');
                const logsRef = collection(db, 'artifacts', APP_ID, 'users', user.uid, 'logs');

                const unsubVehicles = onSnapshot(vehiclesRef, (snapshot) => {
                    const vData = [];
                    snapshot.forEach(docSnap => vData.push({ id: docSnap.id, ...docSnap.data() }));
                    setVehicles(vData);
                    setLoading(false);
                }, (error) => {
                    console.error("Firestore Vehicles Error:", error);
                    setDbMode('local'); // Fallback on permission error
                    setLoading(false);
                });

                const unsubLogs = onSnapshot(logsRef, (snapshot) => {
                    const lData = [];
                    snapshot.forEach(docSnap => lData.push({ id: docSnap.id, ...docSnap.data() }));
                    setLogs(lData);
                }, (error) => console.error("Firestore Logs Error:", error));

                return () => {
                    unsubVehicles();
                    unsubLogs();
                };
            }, [user, dbMode]);

            // Clear log search when switching vehicles
            useEffect(() => {
                setLogSearchTerm('');
            }, [selectedVehicleId]);

            const selectedVehicle = useMemo(() => 
                vehicles.find(v => v.id === selectedVehicleId), 
            [vehicles, selectedVehicleId]);

            const selectedVehicleLogs = useMemo(() => {
                let vehicleLogs = logs.filter(l => l.vehicleId === selectedVehicleId);
                if (logSearchTerm.trim()) {
                    const lowerTerm = logSearchTerm.toLowerCase().trim();
                    vehicleLogs = vehicleLogs.filter(l => 
                        (l.service || '').toLowerCase().includes(lowerTerm) ||
                        (l.notes || '').toLowerCase().includes(lowerTerm) ||
                        (l.cost || '').toString().includes(lowerTerm) ||
                        (l.date || '').includes(lowerTerm)
                    );
                }
                return vehicleLogs.sort((a, b) => new Date(b.date) - new Date(a.date));
            }, [logs, selectedVehicleId, logSearchTerm]);

            const totalCost = useMemo(() => 
                selectedVehicleLogs.reduce((sum, log) => sum + (log.cost || 0), 0),
            [selectedVehicleLogs]);

            const filteredVehicles = useMemo(() => {
                const lowerTerm = searchTerm.toLowerCase().trim();
                if (!lowerTerm) return vehicles;

                return vehicles.filter(v => 
                    (v.make || '').toLowerCase().includes(lowerTerm) ||
                    (v.model || '').toLowerCase().includes(lowerTerm) ||
                    (v.plate || '').toLowerCase().includes(lowerTerm) ||
                    (v.year || '').toString().includes(lowerTerm) ||
                    (v.color || '').toLowerCase().includes(lowerTerm) ||
                    (v.type || '').toLowerCase().includes(lowerTerm) ||
                    (v.trafficFileNo || '').toLowerCase().includes(lowerTerm) ||
                    (v.mulkiyaNo || '').toLowerCase().includes(lowerTerm) ||
                    (v.insuranceProvider || '').toLowerCase().includes(lowerTerm) ||
                    (v.notes || '').toLowerCase().includes(lowerTerm)
                );
            }, [vehicles, searchTerm]);

            const notifications = useMemo(() => {
                const alerts = [];
                if (authError) {
                    alerts.push({ type: 'expired', title: 'Cloud Sync Disabled', msg: authError });
                }
                vehicles.forEach(v => {
                    const daysToMulkiya = getDaysUntil(v.mulkiyaExpiry);
                    if (daysToMulkiya !== null) {
                        if (daysToMulkiya < 0) {
                            alerts.push({ type: 'expired', title: 'Mulkiya Expired', msg: `${v.make} ${v.model}: Registration expired on ${v.mulkiyaExpiry}. Please renew immediately.`, vehicleId: v.id });
                        } else if (daysToMulkiya <= 15) {
                            alerts.push({ type: 'warning', title: 'Mulkiya Expiring Soon', msg: `${v.make} ${v.model}: Registration expires in ${daysToMulkiya} days (${v.mulkiyaExpiry}).`, vehicleId: v.id });
                        }
                    }
                    const daysToIns = getDaysUntil(v.insuranceExpiry);
                    if (daysToIns !== null) {
                        if (daysToIns < 0) {
                            alerts.push({ type: 'expired', title: 'Insurance Expired', msg: `${v.make} ${v.model}: Insurance expired on ${v.insuranceExpiry}.`, vehicleId: v.id });
                        } else if (daysToIns <= 15) {
                            alerts.push({ type: 'warning', title: 'Insurance Expiring Soon', msg: `${v.make} ${v.model}: Insurance expires in ${daysToIns} days (${v.insuranceExpiry}).`, vehicleId: v.id });
                        }
                    }
                });
                return alerts;
            }, [vehicles, authError]);

            const handlePrint = () => { window.print(); };

            const handleExportCSV = () => {
                if (!selectedVehicle) return;
                const vehicleRows = [
                    ['VEHICLE REPORT'], [`Generated on ${new Date().toLocaleDateString()}`], [''],
                    ['VEHICLE DETAILS'], ['Make', selectedVehicle.make], ['Model', selectedVehicle.model],
                    ['Year', selectedVehicle.year], ['Color', selectedVehicle.color], ['Plate', selectedVehicle.plate],
                    ['Mileage', selectedVehicle.mileage], ['Type', selectedVehicle.type], [''],
                    ['DOCUMENT DETAILS'], ['Traffic File No', selectedVehicle.trafficFileNo || 'N/A'],
                    ['Mulkiya No', selectedVehicle.mulkiyaNo || 'N/A'], ['Mulkiya Expiry', selectedVehicle.mulkiyaExpiry || 'N/A'],
                    ['Insurance Provider', selectedVehicle.insuranceProvider || 'N/A'], ['Insurance Expiry', selectedVehicle.insuranceExpiry || 'N/A'],
                    [''], ['SERVICE HISTORY'], ['Date', 'Service', 'Cost', 'Mileage', 'Notes']
                ];
                const logRows = selectedVehicleLogs.map(log => [
                    log.date, `"${(log.service || '').replace(/"/g, '""')}"`, (Number(log.cost) || 0).toFixed(2), log.mileage, `"${(log.notes || '').replace(/"/g, '""')}"`
                ]);
                const csvContent = "data:text/csv;charset=utf-8," + vehicleRows.map(e => e.join(",")).join("\n") + "\n" + logRows.map(e => e.join(",")).join("\n");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `${selectedVehicle.make}_${selectedVehicle.model}_Report.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // Helper to get vehicles grouped/sorted by plate
            const getVehiclesForExport = (plateFilter) => {
                let targetVehicles = [...vehicles];
                if (plateFilter && plateFilter !== 'ALL') {
                    targetVehicles = targetVehicles.filter(v => (v.plate || 'No Plate') === plateFilter);
                }
                return targetVehicles.sort((a, b) => (a.plate || '').localeCompare(b.plate || ''));
            };

            // EXCEL EXPORT: Grouped plate-number wise into individual worksheets and unified plate-ordered sheet
            const handleExportExcelByPlate = (filterPlate = selectedExportPlate) => {
                if (typeof XLSX === 'undefined') {
                    console.error("SheetJS library is not available.");
                    return;
                }

                const targetVehicles = getVehiclesForExport(filterPlate);
                const wb = XLSX.utils.book_new();

                // 1. Consolidated Sheet sorted by Plate Number then by Date
                const consolidatedRows = [];
                targetVehicles.forEach(v => {
                    const plateLabel = v.plate || 'NO-PLATE';
                    const vLogs = logs
                        .filter(l => l.vehicleId === v.id)
                        .sort((a, b) => new Date(b.date) - new Date(a.date));

                    if (vLogs.length === 0) {
                        consolidatedRows.push({
                            "Plate Number": plateLabel,
                            "Vehicle": `${v.make || ''} ${v.model || ''} (${v.year || ''})`.trim(),
                            "Service Date": "No records",
                            "Service Performed": "-",
                            "Mileage (km)": Number(v.mileage) || 0,
                            "Cost (AED)": 0,
                            "Notes": v.notes || '',
                            "Mulkiya Expiry": v.mulkiyaExpiry || 'N/A',
                            "Insurance Provider": v.insuranceProvider || 'N/A'
                        });
                    } else {
                        vLogs.forEach(l => {
                            consolidatedRows.push({
                                "Plate Number": plateLabel,
                                "Vehicle": `${v.make || ''} ${v.model || ''} (${v.year || ''})`.trim(),
                                "Service Date": l.date || 'N/A',
                                "Service Performed": l.service || '',
                                "Mileage (km)": Number(l.mileage) || 0,
                                "Cost (AED)": Number(l.cost) || 0,
                                "Notes": l.notes || '',
                                "Mulkiya Expiry": v.mulkiyaExpiry || 'N/A',
                                "Insurance Provider": v.insuranceProvider || 'N/A'
                            });
                        });
                    }
                });

                const wsConsolidated = XLSX.utils.json_to_sheet(consolidatedRows.length > 0 ? consolidatedRows : [
                    { "Plate Number": "N/A", "Vehicle": "No records", "Service Date": "", "Service Performed": "", "Mileage (km)": 0, "Cost (AED)": 0, "Notes": "" }
                ]);
                XLSX.utils.book_append_sheet(wb, wsConsolidated, "All Logs (By Plate)");

                // 2. Individual sheets per plate for clean tabbed navigation
                targetVehicles.forEach(v => {
                    const rawPlate = (v.plate || `Vehicle-${v.id}`).replace(/[/\\?*[\]:]/g, '_');
                    const plateLabel = rawPlate.substring(0, 31);
                    const vLogs = logs
                        .filter(l => l.vehicleId === v.id)
                        .sort((a, b) => new Date(b.date) - new Date(a.date));

                    const sheetRows = vLogs.map((l, idx) => ({
                        "#": idx + 1,
                        "Plate Number": v.plate || 'N/A',
                        "Date": l.date || 'N/A',
                        "Service": l.service || '',
                        "Mileage (km)": Number(l.mileage) || 0,
                        "Cost (AED)": Number(l.cost) || 0,
                        "Notes": l.notes || ''
                    }));

                    const wsVehicle = XLSX.utils.json_to_sheet(sheetRows.length > 0 ? sheetRows : [{ "Status": "No service logs found for this plate." }]);
                    XLSX.utils.book_append_sheet(wb, wsVehicle, plateLabel);
                });

                // 3. Vehicles Plate Summary Sheet
                const summaryRows = targetVehicles.map(v => {
                    const vLogs = logs.filter(l => l.vehicleId === v.id);
                    const totalSpent = vLogs.reduce((sum, item) => sum + (Number(item.cost) || 0), 0);
                    return {
                        "Plate Number": v.plate || 'N/A',
                        "Make & Model": `${v.make || ''} ${v.model || ''}`,
                        "Year": v.year || '',
                        "Color": v.color || '',
                        "Total Logs": vLogs.length,
                        "Total Cost (AED)": totalSpent,
                        "Current Odometer (km)": Number(v.mileage) || 0,
                        "Mulkiya Expiry": v.mulkiyaExpiry || 'N/A',
                        "Insurance Expiry": v.insuranceExpiry || 'N/A'
                    };
                });
                const wsSummary = XLSX.utils.json_to_sheet(summaryRows);
                XLSX.utils.book_append_sheet(wb, wsSummary, "Plates Summary");

                const dateStr = new Date().toISOString().split('T')[0];
                const cleanPlateName = (filterPlate && filterPlate !== 'ALL') ? `_${filterPlate.replace(/\s+/g, '_')}` : '_All_Plates';
                XLSX.writeFile(wb, `AutoLog_Logs_PlateWise${cleanPlateName}_${dateStr}.xlsx`);
                setIsExportPlateModalOpen(false);
            };

            // PDF EXPORT: Formatted report grouped plate-by-plate with subheaders and plate totals
            const handleExportPDFByPlate = (filterPlate = selectedExportPlate) => {
                if (typeof window.jspdf === 'undefined' || !window.jspdf.jsPDF) {
                    console.error("jsPDF library is not available.");
                    return;
                }

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({
                    orientation: 'landscape',
                    unit: 'pt',
                    format: 'a4'
                });

                const targetVehicles = getVehiclesForExport(filterPlate);

                // Top Header Banner
                doc.setFillColor(40, 51, 26); // dark olive (#28331A)
                doc.rect(0, 0, doc.internal.pageSize.getWidth(), 65, 'F');

                doc.setTextColor(255, 255, 255);
                doc.setFontSize(18);
                doc.setFont("helvetica", "bold");
                doc.text("AutoLog - Vehicle Service Records (Plate Number Wise)", 40, 36);

                doc.setFontSize(9.5);
                doc.setFont("helvetica", "normal");
                const filterDesc = filterPlate === 'ALL' ? 'All Registered Plates' : `Plate: ${filterPlate}`;
                const exportDate = new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
                doc.text(`Scope: ${filterDesc} | Generated: ${exportDate} | Vehicles Included: ${targetVehicles.length}`, 40, 52);

                let currentY = 80;

                targetVehicles.forEach((v) => {
                    const plateNo = v.plate || 'No Plate Assigned';
                    const vLogs = logs
                        .filter(l => l.vehicleId === v.id)
                        .sort((a, b) => new Date(b.date) - new Date(a.date));
                    const vTotalCost = vLogs.reduce((acc, curr) => acc + (Number(curr.cost) || 0), 0);

                    // Check if we need a new page for vehicle section header
                    if (currentY > doc.internal.pageSize.getHeight() - 120) {
                        doc.addPage();
                        currentY = 40;
                    }

                    // Vehicle Section Subheader Card
                    doc.setFillColor(244, 247, 234); // olive-50
                    doc.setDrawColor(213, 227, 168); // olive-200
                    doc.roundedRect(40, currentY, doc.internal.pageSize.getWidth() - 80, 36, 4, 4, 'FD');

                    doc.setFontSize(12);
                    doc.setFont("helvetica", "bold");
                    doc.setTextColor(40, 51, 26);
                    doc.text(`Plate: ${plateNo}`, 50, currentY + 18);

                    doc.setFontSize(9.5);
                    doc.setFont("helvetica", "normal");
                    doc.setTextColor(92, 88, 82);
                    doc.text(`${v.make || ''} ${v.model || ''} (${v.year || ''}) | Odometer: ${(v.mileage || 0).toLocaleString()} km | Mulkiya: ${v.mulkiyaExpiry || 'N/A'}`, 190, currentY + 18);

                    doc.setFont("helvetica", "bold");
                    doc.setTextColor(96, 124, 60);
                    doc.text(`Spent: AED ${vTotalCost.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })} (${vLogs.length} logs)`, doc.internal.pageSize.getWidth() - 250, currentY + 18);

                    currentY += 44;

                    const tableRows = vLogs.map((l, lIdx) => [
                        lIdx + 1,
                        l.date || 'N/A',
                        plateNo,
                        l.service || 'N/A',
                        (l.mileage || 0).toLocaleString() + ' km',
                        'AED ' + (Number(l.cost) || 0).toFixed(2),
                        l.notes || '-'
                    ]);

                    doc.autoTable({
                        head: [['#', 'Date', 'Plate', 'Service Description', 'Mileage', 'Cost (AED)', 'Notes']],
                        body: tableRows.length > 0 ? tableRows : [['-', '-', plateNo, 'No service history recorded for this plate', '-', 'AED 0.00', '-']],
                        startY: currentY,
                        margin: { left: 40, right: 40 },
                        styles: {
                            fontSize: 8.5,
                            cellPadding: 5,
                            textColor: [44, 42, 38],
                            valign: 'middle'
                        },
                        headStyles: {
                            fillColor: [96, 124, 60],
                            textColor: [255, 255, 255],
                            fontStyle: 'bold'
                        },
                        alternateRowStyles: {
                            fillColor: [253, 251, 246]
                        },
                        columnStyles: {
                            0: { cellWidth: 25, halign: 'center' },
                            1: { cellWidth: 65 },
                            2: { cellWidth: 70 },
                            3: { cellWidth: 150 },
                            4: { cellWidth: 80, halign: 'right' },
                            5: { cellWidth: 80, halign: 'right' },
                            6: { cellWidth: 'auto' }
                        },
                        didDrawPage: function () {
                            doc.setFontSize(8);
                            doc.setTextColor(148, 141, 130);
                            doc.text(`AutoLog Maintenance Management - Plate-wise Record`, 40, doc.internal.pageSize.getHeight() - 15);
                            doc.text(`Page ${doc.internal.getCurrentPageInfo().pageNumber}`, doc.internal.pageSize.getWidth() - 70, doc.internal.pageSize.getHeight() - 15);
                        }
                    });

                    currentY = doc.lastAutoTable.finalY + 24;
                });

                const dateStr = new Date().toISOString().split('T')[0];
                const cleanPlateName = (filterPlate && filterPlate !== 'ALL') ? `_${filterPlate.replace(/\s+/g, '_')}` : '_All_Plates';
                doc.save(`AutoLog_Logs_PlateWise${cleanPlateName}_${dateStr}.pdf`);
                setIsExportPlateModalOpen(false);
            };

            // Selected Vehicle Export helpers for Details View
            const handleExportSelectedPDF = () => {
                if (!selectedVehicle) return;
                handleExportPDFByPlate(selectedVehicle.plate || 'No Plate');
            };

            const handleExportSelectedExcel = () => {
                if (!selectedVehicle) return;
                handleExportExcelByPlate(selectedVehicle.plate || 'No Plate');
            };

            const handleLogout = async () => {
                if (user) {
                    await signOut(auth);
                }
                setDbMode('cloud');
            };

            const handleAuthSubmit = async (e) => {
                e.preventDefault();
                setAuthError(null);
                setAuthInProgress(true);
                try {
                    if (isLoginMode) {
                        await signInWithEmailAndPassword(auth, authEmail, authPassword);
                    } else {
                        await createUserWithEmailAndPassword(auth, authEmail, authPassword);
                    }
                } catch (err) {
                    setAuthError(err.message || "Authentication failed.");
                } finally {
                    setAuthInProgress(false);
                }
            };

            const handleOpenAddVehicle = () => { setEditingVehicle(null); setIsVehicleModalOpen(true); };
            const handleOpenEditVehicle = (e, vehicle) => { e.stopPropagation(); setEditingVehicle(vehicle); setIsVehicleModalOpen(true); };
            
            const handleSaveVehicle = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const vehicleData = {
                    make: formData.get('make'),
                    model: formData.get('model'),
                    year: parseInt(formData.get('year')),
                    plate: formData.get('plate'),
                    color: formData.get('color'),
                    mileage: parseInt(formData.get('mileage')) || 0,
                    type: formData.get('type') || 'sedan',
                    notes: formData.get('notes'),
                    trafficFileNo: formData.get('trafficFileNo'),
                    mulkiyaNo: formData.get('mulkiyaNo'),
                    mulkiyaExpiry: formData.get('mulkiyaExpiry'),
                    insuranceProvider: formData.get('insuranceProvider'),
                    insuranceExpiry: formData.get('insuranceExpiry'),
                };
                
                if (dbMode === 'cloud' && user) {
                    const vId = editingVehicle ? editingVehicle.id : Date.now().toString();
                    const docRef = doc(db, 'artifacts', APP_ID, 'users', user.uid, 'vehicles', vId);
                    await setDoc(docRef, vehicleData, { merge: true });
                } else {
                    if (editingVehicle) {
                        setVehicles(vehicles.map(v => v.id === editingVehicle.id ? { ...v, ...vehicleData } : v));
                    } else {
                        setVehicles([...vehicles, { id: Date.now().toString(), ...vehicleData }]);
                    }
                }
                setIsVehicleModalOpen(false);
            };

            const handleOpenAddLog = () => { setEditingLog(null); setIsAddLogOpen(true); };
            const handleOpenEditLog = (e, log) => { e.stopPropagation(); setEditingLog(log); setIsAddLogOpen(true); };

            const handleSaveLog = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const logData = {
                    vehicleId: selectedVehicleId,
                    date: formData.get('date'),
                    service: formData.get('service'),
                    cost: parseFloat(formData.get('cost')) || 0,
                    mileage: parseInt(formData.get('mileage')) || 0,
                    notes: formData.get('notes'),
                };
                
                if (dbMode === 'cloud' && user) {
                    const lId = editingLog ? editingLog.id : Date.now().toString();
                    const logRef = doc(db, 'artifacts', APP_ID, 'users', user.uid, 'logs', lId);
                    await setDoc(logRef, logData, { merge: true });
                    
                    if (logData.mileage > (selectedVehicle.mileage || 0)) {
                        const vRef = doc(db, 'artifacts', APP_ID, 'users', user.uid, 'vehicles', selectedVehicleId.toString());
                        await setDoc(vRef, { mileage: logData.mileage }, { merge: true });
                    }
                } else {
                    if (editingLog) {
                        setLogs(logs.map(l => l.id === editingLog.id ? { ...l, ...logData } : l));
                    } else {
                        setLogs([...logs, { id: Date.now().toString(), ...logData }]);
                    }
                    if (logData.mileage > (selectedVehicle.mileage || 0)) {
                        setVehicles(vehicles.map(v => v.id === selectedVehicleId ? { ...v, mileage: logData.mileage } : v));
                    }
                }
                
                setIsAddLogOpen(false);
                setEditingLog(null);
            };

            const requestDeleteVehicle = (e, id) => { e.stopPropagation(); setDeleteConfirmation({ isOpen: true, type: 'vehicle', id }); };
            const requestDeleteLog = (id) => { setDeleteConfirmation({ isOpen: true, type: 'log', id }); };

            const confirmDelete = async () => {
                const { type, id } = deleteConfirmation;
                
                if (dbMode === 'cloud' && user) {
                    if (type === 'vehicle') {
                        await deleteDoc(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'vehicles', id.toString()));
                        const vehicleLogs = logs.filter(l => l.vehicleId === id);
                        for (const l of vehicleLogs) {
                            await deleteDoc(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'logs', l.id.toString()));
                        }
                    } else if (type === 'log') {
                        await deleteDoc(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'logs', id.toString()));
                    }
                } else {
                    if (type === 'vehicle') {
                        setVehicles(vehicles.filter(v => v.id !== id));
                        setLogs(logs.filter(l => l.vehicleId !== id));
                    } else if (type === 'log') {
                        setLogs(logs.filter(l => l.id !== id));
                    }
                }

                if (type === 'vehicle' && selectedVehicleId === id) {
                    setSelectedVehicleId(null);
                    setActiveTab('garage');
                }
                
                setDeleteConfirmation({ isOpen: false, type: null, id: null });
            };

            if (authLoading) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-cream-100">
                        <div className="w-12 h-12 border-4 border-olive-200 border-t-olive-600 rounded-full animate-spin mb-4"></div>
                        <p className="text-olive-700 font-medium">Connecting...</p>
                    </div>
                );
            }

            if (!user && dbMode === 'cloud') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-cream-100 p-6 selection:bg-olive-200 selection:text-olive-900">
                        <div className="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden border border-olive-100 animate-[fadeIn_0.3s_ease-out]">
                            <div className="bg-olive-900 p-8 text-center text-white">
                                <div className="w-16 h-16 bg-olive-700 rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-inner">
                                    <Icon name="car" size={32} />
                                </div>
                                <h1 className="text-3xl font-bold tracking-tight">AutoLog</h1>
                                <p className="text-olive-300 mt-2">Premium Maintenance Tracker</p>
                            </div>
                            
                            <form onSubmit={handleAuthSubmit} className="p-8 space-y-6">
                                {authError && (
                                    <div className="bg-red-50 text-red-700 p-3 rounded-xl text-sm border border-red-100 flex items-start gap-2">
                                        <Icon name="alert" size={16} className="mt-0.5 flex-shrink-0" />
                                        <span>{authError}</span>
                                    </div>
                                )}
                                
                                <InputGroup label="Email Address">
                                    <input 
                                        type="email" 
                                        required 
                                        value={authEmail} 
                                        onChange={e => setAuthEmail(e.target.value)} 
                                        className="w-full px-4 py-3 bg-cream-50 border border-olive-200 rounded-xl focus:ring-2 focus:ring-olive-500 focus:outline-none transition-all" 
                                        placeholder="you@example.com"
                                    />
                                </InputGroup>
                                
                                <InputGroup label="Password">
                                    <input 
                                        type="password" 
                                        required 
                                        value={authPassword} 
                                        onChange={e => setAuthPassword(e.target.value)} 
                                        className="w-full px-4 py-3 bg-cream-50 border border-olive-200 rounded-xl focus:ring-2 focus:ring-olive-500 focus:outline-none transition-all" 
                                        placeholder="••••••••"
                                    />
                                </InputGroup>
                                
                                <Button type="submit" className="w-full py-3 text-lg" disabled={authInProgress}>
                                    {authInProgress ? 'Processing...' : (isLoginMode ? 'Sign In' : 'Create Account')}
                                </Button>
                                
                                <div className="text-center pt-2 border-t border-olive-100">
                                    <p className="text-earth-600 text-sm mb-4">
                                        {isLoginMode ? "Don't have an account?" : "Already have an account?"}
                                        <button 
                                            type="button" 
                                            onClick={() => setIsLoginMode(!isLoginMode)} 
                                            className="ml-2 font-bold text-olive-600 hover:text-olive-800 transition-colors"
                                        >
                                            {isLoginMode ? 'Sign Up' : 'Log In'}
                                        </button>
                                    </p>
                                    
                                    <button 
                                        type="button" 
                                        onClick={() => setDbMode('local')} 
                                        className="text-xs text-olive-400 hover:text-olive-600 transition-colors underline underline-offset-2"
                                    >
                                        Continue without an account (Offline Mode)
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                );
            }

            if (loading) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-cream-100">
                        <div className="w-12 h-12 border-4 border-olive-200 border-t-olive-600 rounded-full animate-spin mb-4"></div>
                        <p className="text-olive-700 font-medium">Loading Data...</p>
                    </div>
                );
            }

            const renderGarageView = () => (
                <div className="space-y-8 animate-[fadeIn_0.5s_ease-out]">
                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 border-b border-olive-200 pb-6 no-print">
                        <div>
                            <h2 className="text-3xl font-bold text-olive-900 tracking-tight">My Garage</h2>
                            <p className="text-olive-600 mt-1 flex items-center gap-2">
                                Manage your fleet status and maintenance.
                                {dbMode === 'local' && <span className="bg-yellow-100 text-yellow-800 text-[10px] px-2 py-0.5 rounded-full font-bold">Local Mode</span>}
                            </p>
                        </div>
                        <div className="flex flex-wrap items-center gap-3 w-full lg:w-auto">
                            <div className="relative flex-grow sm:flex-grow-0">
                                <div className="absolute left-3 top-1/2 -translate-y-1/2 text-olive-400">
                                    <Icon name="search" size={16} />
                                </div>
                                <input 
                                    type="text" 
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    placeholder="Search make, model, plate..." 
                                    className="pl-10 pr-4 py-2.5 bg-white border border-olive-200 rounded-xl text-sm w-full sm:w-60 focus:outline-none focus:ring-2 focus:ring-olive-500 text-olive-800 placeholder-olive-400 transition-all shadow-sm"
                                />
                            </div>

                            <Button 
                                variant="secondary" 
                                onClick={() => setIsExportPlateModalOpen(true)} 
                                icon="layers" 
                                title="Export logs grouped by Plate Number in PDF & Excel"
                                className="!py-2.5 !px-3.5 text-xs sm:text-sm font-semibold"
                            >
                                Export by Plate
                            </Button>

                            <Button onClick={handleOpenAddVehicle} icon="plus">Add Vehicle</Button>
                        </div>
                    </div>

                    <NotificationBanner notifications={notifications} />

                    <div className="flex flex-col gap-4">
                        {filteredVehicles.length === 0 ? (
                            <div className="col-span-full flex flex-col items-center justify-center py-16 text-center text-olive-400 border-2 border-dashed border-olive-200 rounded-3xl bg-olive-50/30">
                                <div className="mb-4 p-4 bg-olive-50 rounded-full">
                                    <Icon name="car" size={40} className="opacity-50" />
                                </div>
                                <p className="text-xl font-semibold text-olive-700">
                                    {searchTerm ? "No vehicles found" : "Your garage is empty"}
                                </p>
                                <p className="mb-6 text-olive-500">
                                    {searchTerm ? "Try adjusting your search criteria" : "Add your first vehicle to start tracking costs."}
                                </p>
                                {!searchTerm && <Button onClick={handleOpenAddVehicle} icon="plus">Add Vehicle</Button>}
                            </div>
                        ) : (
                            filteredVehicles.map(vehicle => {
                                const vLogs = logs.filter(l => l.vehicleId === vehicle.id);
                                const lastService = vLogs.length > 0 
                                    ? new Date(Math.max(...vLogs.map(l => new Date(l.date)))).toLocaleDateString()
                                    : 'None';

                                const isMulkiyaExpiring = getDaysUntil(vehicle.mulkiyaExpiry) <= 15;
                                const isInsExpiring = getDaysUntil(vehicle.insuranceExpiry) <= 15;
                                const hasAlert = isMulkiyaExpiring || isInsExpiring;

                            <div className="grid grid-cols-2 gap-5">
                                <InputGroup label="Date">
                                    <input name="date" type="date" required defaultValue={editingLog?.date || new Date().toISOString().split('T')[0]} className="w-full px-4 py-2.5 bg-white border border-olive-200 rounded-xl focus:ring-2 focus:ring-olive-500 focus:outline-none transition-all" />
                                </InputGroup>
                                <InputGroup label="Cost">
                                    <div className="relative">
                                        <span className="absolute left-4 top-2.5 text-olive-400 font-bold text-xs mt-0.5">AED</span>
                                        <input name="cost" type="number" step="0.01" defaultValue={editingLog?.cost} placeholder="0.00" className="w-full pl-12 pr-4 py-2.5 bg-white border border-olive-200 rounded-xl focus:ring-2 focus:ring-olive-500 focus:outline-none transition-all" />
                                    </div>
                                </InputGroup>
                            </div>

                            <InputGroup label="Mileage at Service" subtext="This will update the vehicle's current odometer">
                                <input name="mileage" type="number" defaultValue={editingLog?.mileage || selectedVehicle?.mileage} className="w-full px-4 py-2.5 bg-white border border-olive-200 rounded-xl focus:ring-2 focus:ring-olive-500 focus:outline-none transition-all" />
                            </InputGroup>

                            <InputGroup label="Notes">
                                <textarea name="notes" rows="3" defaultValue={editingLog?.notes} placeholder="Additional details..." className="w-full px-4 py-2.5 bg-white border border-olive-200 rounded-xl focus:ring-2 focus:ring-olive-500 focus:outline-none transition-all"></textarea>
                            </InputGroup>

                            <div className="pt-6 flex gap-4">
                                <Button type="button" variant="secondary" className="flex-1" onClick={() => { setIsAddLogOpen(false); setEditingLog(null); }}>Cancel</Button>
                                <Button type="submit" className="flex-1" icon="save">Save Record</Button>
                            </div>
                        </form>
                    </Modal>

                    <Modal 
                        isOpen={isExportPlateModalOpen} 
                        onClose={() => setIsExportPlateModalOpen(false)} 
                        title="Download Logs by Plate Number"
                    >
                        <div className="space-y-5">
                            <p className="text-sm text-olive-700">
                                Export all vehicle maintenance logs structured and grouped by plate number. You can download all registered plates or select a specific plate.
                            </p>

                            <InputGroup label="Select Plate Number">
                                <div className="relative">
                                    <select 
                                        value={selectedExportPlate} 
                                        onChange={(e) => setSelectedExportPlate(e.target.value)}
                                        className="w-full px-4 py-2.5 bg-white border border-olive-200 rounded-xl focus:ring-2 focus:ring-olive-500 focus:outline-none transition-all appearance-none font-mono"
                                    >
                                        <option value="ALL">All Plates (Grouped & Ordered)</option>
                                        {vehicles.map(v => (
                                            <option key={v.id} value={v.plate || 'No Plate'}>
                                                {v.plate ? `${v.plate} - ${v.make} ${v.model}` : `(No Plate) - ${v.make} ${v.model}`}
                                            </option>
                                        ))}
                                    </select>
                                    <div className="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-olive-500">
                                        <svg className="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clipRule="evenodd" fillRule="evenodd"></path></svg>
                                    </div>
                                </div>
                            </InputGroup>

                            <div className="bg-olive-50 border border-olive-100 p-4 rounded-xl text-xs space-y-1.5 text-olive-800">
                                <p className="font-bold flex items-center gap-1.5 text-olive-900">
                                    <Icon name="layers" size={14} /> Plate-Wise Formatting
                                </p>
                                <p>• <strong>PDF:</strong> Outputs structured sub-sections by Plate Number with odometer, Mulkiya expiry, total expenditure, and detailed logs.</p>
                                <p>• <strong>Excel:</strong> Generates a unified sheet sorted by plate number plus individual worksheets for each plate number.</p>
                            </div>

                            <div className="pt-2 flex flex-col sm:flex-row gap-3">
                                <Button 
                                    variant="secondary" 
                                    onClick={() => handleExportPDFByPlate(selectedExportPlate)}
                                    icon="filePdf"
                                    className="flex-1"
                                >
                                    Download PDF
                                </Button>
                                <Button 
                                    variant="primary" 
                                    onClick={() => handleExportExcelByPlate(selectedExportPlate)}
                                    icon="fileSpreadsheet"
                                    className="flex-1"
                                >
                                    Download Excel
                                </Button>
                            </div>
                        </div>
                    </Modal>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
